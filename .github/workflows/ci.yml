name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.83.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy

      - name: Rust toolchain sanity check
        run: |
          rustup show
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs]'

      - name: Run full repository check
        shell: bash
        run: python scripts/check_all.py

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.11
          path: coverage.xml
          if-no-files-found: ignore

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.83.0
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy

      - name: Rust toolchain sanity check
        run: |
          rustup show
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Type check supported Python version
        shell: bash
        run: python -m mypy --python-version "${{ matrix.python-version }}" python/pyabundance

      - name: Run tests
        shell: bash
        run: python -m pytest -q

  merge-gate:
    name: Merge gate
    if: always()
    needs: [full-check, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        env:
          FULL_CHECK_RESULT: ${{ needs.full-check.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$FULL_CHECK_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
